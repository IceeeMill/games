    <style>
      /* game.less */
      body {
        background-color: black;
        font-family: 'Ubuntu', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        color: white;
      }

      :root {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      /* See scaling.ts */
      :root {
        --scale-size: 1;
        --inset-width: 100vw;
        --inset-height: 100vh;
        /* Bottom space reserved for the in-game banner ad; set by the ad lib. */
        --ad-footer-height: 0px;
      }

      html,
      body,
      #canvas {
        position: absolute;
        width: 100vw;
        height: 100%;
        /* background-color: green; */
        /* background: linear-gradient(0deg, white 0%, green 12.5%, red 25%, blue 100%); */
        /* max-height: -webkit-fill-available; */
        border: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      #loading {
        color: white;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48pt;
        font-family: sans-serif;
        font-weight: bold;
        cursor: default;
      }

      #canvas {
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        right: 0;
        /* Crop to sit above the banner ad; height:auto lets top+bottom size it. */
        bottom: var(--ad-footer-height, 0px);
        height: auto;
        cursor: default;
      }

      #textInputContainer {
        display: none;
        position: absolute;
      }

      #textInput {
        background-color: transparent;
        font-family: 'Ubuntu', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        padding: 0;
        border: 0;
        outline: none;
      }
    </style>
    <style>
      /* index.less */
      @keyframes screen-animator {
        0% {
          opacity: 0;
        }
        99% {
        }
        100% {
          opacity: 1;
        }
      }

      #screen-holder > .screen:not(.active) {
        display: none !important;
        pointer-events: none;
        position: absolute;
      }

      #screen-holder > .screen.active {
        animation-name: screen-animator;
        animation-duration: 0.22s;
        pointer-events: all;
      }

      #screen-holder {
        z-index: 2;
      }

      #screen-holder,
      #modal-holder {
        position: absolute;
        width: 100%;
        height: 100%;

        position: fixed;
        left: 0px;
        right: 0px;
        top: 0px;
        bottom: 0px;
        transform: scale(var(--scale-size));
      }

      #modal-holder {
        z-index: 2000;
      }

      /* Backdrop. --scale-size drops under 1 below ~1280x720, so a viewport-sized box
         paints smaller than the viewport; --scale-width/height are pre-scale units. */
      #modal-holder::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--scale-width);
        height: var(--scale-height);
        transform: translate(-50%, -50%);
        z-index: -1;
        pointer-events: none;
      }
      #modal-holder > .modal {
        position: absolute;
      }
      #modal-holder > .modal:not(.active) {
        display: none !important;
        pointer-events: none;
      }

      #modal-holder:not(.active) {
        display: none;
        opacity: 0;
        pointer-events: none;
      }
      #modal-holder.inuse {
        animation-name: screen-animator;
        animation-duration: 0.22s;
        pointer-events: all;
        display: block;
        opacity: 1;
      }
    </style>
    <style>
      /* loading.less */
      #loading-screen {
        display: flex;
        flex-flow: column wrap;
        justify-content: space-around;

        width: 100%;
        height: 100%;

        & > div {
          margin: 0;
          flex: 0 0 auto;

          text-align: center;
        }
      }
    </style>
